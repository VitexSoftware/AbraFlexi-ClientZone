; Applied under php-fpm (AllowOverride All). Ignored by mod_php when php_admin_value is set.
; /etc/locale.alias required: /usr/share/locale/locale.alias → symlink (Ease\Locale scan)
open_basedir = /usr/share/abraflexi-clientzone/:/etc/abraflexi-client-zone/:/etc/abraflexi/:/etc/locale.alias:/usr/share/php/:/usr/share/javascript/:/usr/share/locale/:/var/cache/abraflexi-clientzone/:/var/lib/abraflexi-clientzone/:/var/tmp/:/tmp/
upload_tmp_dir = /var/lib/abraflexi-clientzone/tmp
session.save_path = /var/lib/abraflexi-clientzone/tmp
allow_url_fopen = On
