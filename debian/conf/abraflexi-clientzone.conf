# abraflexi-clientzone default Apache configuration

Alias /clientzone /usr/share/abraflexi-clientzone
Alias /abraflexi-clientzone /usr/share/abraflexi-clientzone

<Directory /usr/share/abraflexi-clientzone/>
	Options FollowSymLinks
	AllowOverride All
	Require all granted
	DirectoryIndex index.php

	# mod_php (libapache2-mod-php*): php_admin_value only works here.
	# Under php-fpm these directives are skipped; see .user.ini shipped with the app.
	<IfModule mod_php.c>
		AddType application/x-httpd-php .php
		<FilesMatch ".+\.php$">
			SetHandler application/x-httpd-php
		</FilesMatch>
		php_admin_flag allow_url_fopen On
		php_admin_value open_basedir "/usr/share/abraflexi-clientzone/:/etc/abraflexi-client-zone/:/etc/abraflexi/:/usr/share/php/:/usr/share/javascript/:/usr/share/locale/:/var/cache/abraflexi-clientzone/:/var/lib/abraflexi-clientzone/:/var/tmp/:/tmp/"
		php_admin_value upload_tmp_dir "/var/lib/abraflexi-clientzone/tmp"
		php_admin_value session.save_path "/var/lib/abraflexi-clientzone/tmp"
	</IfModule>
	<IfModule mod_php7.c>
		AddType application/x-httpd-php .php
		<FilesMatch ".+\.php$">
			SetHandler application/x-httpd-php
		</FilesMatch>
		php_admin_flag allow_url_fopen On
		php_admin_value open_basedir "/usr/share/abraflexi-clientzone/:/etc/abraflexi-client-zone/:/etc/abraflexi/:/usr/share/php/:/usr/share/javascript/:/usr/share/locale/:/var/cache/abraflexi-clientzone/:/var/lib/abraflexi-clientzone/:/var/tmp/:/tmp/"
		php_admin_value upload_tmp_dir "/var/lib/abraflexi-clientzone/tmp"
		php_admin_value session.save_path "/var/lib/abraflexi-clientzone/tmp"
	</IfModule>

	<IfModule mod_deflate.c>
		AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/x-javascript text/javascript application/javascript application/json
	</IfModule>
</Directory>
