# abraflexi-clientzone default Apache configuration

Alias /clientzone /usr/share/abraflexi-clientzone
Alias /abraflexi-clientzone /usr/share/abraflexi-clientzone

<Directory /usr/share/abraflexi-clientzone/>
	Options FollowSymLinks
	DirectoryIndex index.php

	<IfModule mod_php.c>
		AddType application/x-httpd-php .php
		<FilesMatch ".+\.php$">
			SetHandler application/x-httpd-php
		</FilesMatch>
		php_admin_value open_basedir /usr/share/abraflexi-clientzone/:/etc/abraflexi-client-zone/:/etc/abraflexi/:/usr/share/php/:/usr/share/javascript/:/var/tmp:/tmp:/usr/share/locale:/var/cache/abraflexi-clientzone/:/var/lib/abraflexi-clientzone/
	</IfModule>

	# enable gzip compression
	<IfModule mod_deflate.c>
		AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/x-javascript text/javascript application/javascript application/json
	</IfModule>
</Directory>
